name: naboo-image
# Builds the hardened, self-contained OpenSRE image (Dockerfile.naboo) and
# pushes it to GHCR. Image: ghcr.io/apham-naboo/opensre:naboo-<sha> + :naboo-latest
on:
  workflow_dispatch:
  push:
    branches: [naboo]
permissions:
  contents: read
  packages: write
concurrency:
  group: naboo-image
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.naboo
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/apham-naboo/opensre:naboo-${{ github.sha }}
            ghcr.io/apham-naboo/opensre:naboo-latest
